<svg xmlns="http://www.w3.org/2000/svg" width="760" height="150" viewBox="0 0 760 150" role="img" aria-label="GitHub stats">
<style>
  .t { font: 600 15px -apple-system, Segoe UI, Helvetica, Arial, sans-serif; fill: #1f2328; }
  .h { font: 600 14px -apple-system, Segoe UI, Helvetica, Arial, sans-serif; fill: #1f2328; }
  .l { font: 12px -apple-system, Segoe UI, Helvetica, Arial, sans-serif; fill: #424a53; }
  .m { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #59636e; }
  .k { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #59636e; letter-spacing: 2px; }
  .card { fill: #f6f8fa; stroke: #d0d7de; }
  @media (prefers-color-scheme: dark) {
    .t, .h { fill: #e6edf3; }
    .l { fill: #c9d1d9; }
    .m, .k { fill: #9198a1; }
    .card { fill: #161b22; stroke: #30363d; }
  }
</style>
<text class="t" x="20" y="28">By the numbers</text>
<rect class="card" x="20" y="44" width="168" height="92" rx="8"/>
<rect x="20" y="44" width="168" height="4" rx="2" fill="#5794F2"/>
<text class="k" x="36" y="72">CONTRIBUTIONS</text>
<text x="36" y="106" style="font:700 30px -apple-system,Segoe UI,Helvetica,Arial,sans-serif" fill="#5794F2">49</text>
<text class="m" x="36" y="126">last 12 months</text>
<rect class="card" x="204" y="44" width="168" height="92" rx="8"/>
<rect x="204" y="44" width="168" height="4" rx="2" fill="#73BF69"/>
<text class="k" x="220" y="72">COMMITS</text>
<text x="220" y="106" style="font:700 30px -apple-system,Segoe UI,Helvetica,Arial,sans-serif" fill="#73BF69">35</text>
<text class="m" x="220" y="126">last 12 months</text>
<rect class="card" x="388" y="44" width="168" height="92" rx="8"/>
<rect x="388" y="44" width="168" height="4" rx="2" fill="#B877D9"/>
<text class="k" x="404" y="72">PULL REQUESTS</text>
<text x="404" y="106" style="font:700 30px -apple-system,Segoe UI,Helvetica,Arial,sans-serif" fill="#B877D9">6</text>
<text class="m" x="404" y="126">last 12 months</text>
<rect class="card" x="572" y="44" width="168" height="92" rx="8"/>
<rect x="572" y="44" width="168" height="4" rx="2" fill="#FF9830"/>
<text class="k" x="588" y="72">PUBLIC REPOS</text>
<text x="588" y="106" style="font:700 30px -apple-system,Segoe UI,Helvetica,Arial,sans-serif" fill="#FF9830">4</text>
<text class="m" x="588" y="126">built from scratch</text>
</svg>
