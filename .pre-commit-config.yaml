# Install once:  uv tool install pre-commit && pre-commit install --hook-type pre-commit --hook-type pre-push
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-xml
        name: check svg is valid xml
        files: \.svg$
        types: [file]
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: \.svg$
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: check-public
        name: opsec check
        entry: python3 .assets/check_public.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]
      - id: build-runs
        name: graphics still build
        entry: python3 -c "import ast,sys; ast.parse(open('.assets/build.py').read())"
        language: system
        pass_filenames: false
        files: ^\.assets/
