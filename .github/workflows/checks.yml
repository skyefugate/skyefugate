name: Checks

on:
  pull_request:
  push:
    branches: [profile]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run all hooks
        env:
          GH_TOKEN: ${{ github.token }}
          SKIP: no-commit-to-branch
        run: pipx run pre-commit run --all-files --show-diff-on-failure
